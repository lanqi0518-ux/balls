name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race; the second one waits for the first to finish.
concurrency:
  group: deploy-fly
  cancel-in-progress: false

jobs:
  deploy:
    name: Fly.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only --wait-timeout 300
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
