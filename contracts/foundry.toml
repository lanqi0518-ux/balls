[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
robinhood = "https://rpc.robinhoodchain.com"
robinhood_testnet = "https://testnet-rpc.robinhoodchain.com"

[etherscan]
robinhood = { key = "${ETHERSCAN_API_KEY}" }
