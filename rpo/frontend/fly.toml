# --- Fly.io app config: RPO frontend --------------------------------------
# Deploys the Next.js standalone build.
# App name is bound at first `flyctl launch`; feel free to change to
# match what you've reserved in your Fly.io org.

app = "rpo-web"
primary_region = "fra"           # Frankfurt — good for EU/global reach.
# Add extras later with:  flyctl regions add iad sjc nrt gru
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  # Fly's Depot builder produces subtly-broken output for our root
  # marketing route (compiles `app/page.tsx` to a near-empty client
  # bundle, so the deployed `/` responded with `/app` content instead
  # of the Hero). Ship a locally-built `.next/standalone` directly
  # instead — the runtime image just runs `node server.js`.
  dockerfile = "Dockerfile.prebuilt"

[env]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_ENV                = "production"
  # Injected by Fly-Cloudflare handshake; used by the geo-blocking
  # middleware as a fallback if Cloudflare's cf-ipcountry header is absent.
  ENFORCE_GEO_BLOCK = "1"

[http_service]
  internal_port         = 3000
  force_https           = true
  auto_stop_machines    = "off"      # always-on for smooth global UX
  auto_start_machines   = true
  min_machines_running  = 1          # keep at least 1 hot per region
  processes             = ["app"]

  [http_service.concurrency]
    type       = "requests"
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    grace_period  = "10s"
    interval      = "30s"
    method        = "GET"
    path          = "/"
    protocol      = "http"
    timeout       = "5s"

[[vm]]
  size    = "shared-cpu-1x"
  memory  = "512mb"
  cpus    = 1

# Enable Fly's built-in metrics scraping (Prometheus format at /metrics
# would need to be added to Next.js if you want app-level metrics).
[metrics]
  port = 9091
  path = "/metrics"
