# fly.toml — Digital Human Brain
# Public URL: https://brainonchain.online
# NOTE: `app` below is a legacy Fly internal identifier — Fly does not
# allow in-place app renames, and changing it would require creating a
# new app + redoing TLS certs + secrets. It is invisible to end users.
#
# This config is deliberately hardened so the brain runs 24/7 with no
# way for the platform to pause it and no way for a transient crash to
# take it down for long:
#
#   * auto_stop_machines = "off"     — Fly never suspends the VM.
#   * min_machines_running = 1        — at least one VM is always up.
#   * restart.policy = "always"       — process crash → immediate respawn.
#   * kill_signal = "SIGTERM" + generous kill_timeout — gives the brain
#     time to flush state to disk during a rolling deploy before SIGKILL.
#   * swap_size_mb — a safety valve so a transient memory spike from the
#     web-embodiment Chromium doesn't OOM-kill the whole pod.

app = "balls-lanqi"
primary_region = "sjc"

kill_signal = "SIGTERM"
kill_timeout = "20s"
swap_size_mb = 512

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  PYTHONUNBUFFERED = "1"
  DATA_DIR = "/data"
  BRAIN_MODE = "einstein"

[http_service]
  internal_port = 8080
  force_https = true
  # Trading loops run in the background and would be lost if the machine
  # suspended. Keep at least one running so the cortex accumulates state.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 80
    soft_limit = 40

  [[http_service.checks]]
    grace_period = "30s"
    interval = "20s"
    method = "GET"
    timeout = "5s"
    path = "/health"

# Restart policy: anytime the container process exits (uvicorn crash,
# python OOM, whatever) Fly should immediately relaunch it.
[[restart]]
  policy = "always"

[[vm]]
  # Bumped to 2GB and 2 CPUs so the headless Chromium web-embodiment
  # subsystem has memory headroom alongside PyTorch + the spiking
  # central complex.
  size = "shared-cpu-2x"
  memory = "2gb"
  cpus = 2

# One volume per machine; created via `flyctl volumes create data -r sjc -s 1`.
# The brain's cortex weights, hippocampus, and paper-book all live here so
# a VM restart or rolling deploy is invisible to the brain's learning
# history.
[[mounts]]
  source = "data"
  destination = "/data"
