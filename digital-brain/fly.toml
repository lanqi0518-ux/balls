# fly.toml — Digital Human Brain
# Deploy target: https://fly.io/apps/balls-lanqi

app = "balls-lanqi"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  PYTHONUNBUFFERED = "1"
  DATA_DIR = "/data"
  BRAIN_MODE = "einstein"

[http_service]
  internal_port = 8080
  force_https = true
  # Trading loops run in the background and would be lost if the machine
  # suspended. Keep at least one running so the cortex accumulates state.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 80
    soft_limit = 40

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  cpus = 1

# One volume per machine; created via `flyctl volumes create data -r sjc -s 1`
[[mounts]]
  source = "data"
  destination = "/data"
