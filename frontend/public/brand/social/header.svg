<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" role="img" aria-label="Balls">
  <defs>
    <radialGradient id="bg" cx="0.20" cy="0.15" r="1.1">
      <stop offset="0%"   stop-color="#152a4a"/>
      <stop offset="45%"  stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#040914"/>
    </radialGradient>

    <radialGradient id="body" cx="0.35" cy="0.28" r="0.78">
      <stop offset="0%"   stop-color="#ff9098"/>
      <stop offset="40%"  stop-color="#ef3247"/>
      <stop offset="80%"  stop-color="#b8102a"/>
      <stop offset="100%" stop-color="#7c0a1c"/>
    </radialGradient>

    <radialGradient id="accentBall" cx="0.35" cy="0.30" r="0.72">
      <stop offset="0%"   stop-color="#ff8590"/>
      <stop offset="45%"  stop-color="#ef3247"/>
      <stop offset="100%" stop-color="#a11026"/>
    </radialGradient>

    <radialGradient id="goldBall" cx="0.35" cy="0.30" r="0.72">
      <stop offset="0%"   stop-color="#fff6c9"/>
      <stop offset="45%"  stop-color="#ffcf3a"/>
      <stop offset="100%" stop-color="#b4830c"/>
    </radialGradient>

    <radialGradient id="shine" cx="0.35" cy="0.30" r="0.22">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="55%"  stop-color="#e31937" stop-opacity="0"/>
      <stop offset="100%" stop-color="#e31937" stop-opacity="0.5"/>
    </radialGradient>

    <radialGradient id="rim" cx="0.5" cy="0.55" r="0.5">
      <stop offset="80%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>

    <filter id="dropBig" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="dropSmall" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1500" height="500" fill="url(#bg)"/>
  <rect width="1500" height="500" fill="url(#grid)"/>

  <g opacity="0.35">
    <g filter="url(#dropSmall)">
      <circle cx="1180" cy="90" r="42" fill="url(#accentBall)"/>
      <ellipse cx="1170" cy="80" rx="14" ry="9" fill="url(#shine)"/>
    </g>
    <g filter="url(#dropSmall)">
      <circle cx="1370" cy="180" r="52" fill="url(#goldBall)"/>
      <ellipse cx="1358" cy="168" rx="17" ry="11" fill="url(#shine)"/>
    </g>
    <g filter="url(#dropSmall)">
      <circle cx="1310" cy="440" r="38" fill="url(#accentBall)"/>
      <ellipse cx="1302" cy="432" rx="12" ry="8" fill="url(#shine)"/>
    </g>
    <g filter="url(#dropSmall)">
      <circle cx="1440" cy="380" r="28" fill="url(#accentBall)"/>
      <ellipse cx="1434" cy="374" rx="9" ry="6" fill="url(#shine)"/>
    </g>
  </g>

  <g transform="translate(280 250)">
    <circle cx="0" cy="0" r="230" fill="url(#halo)"/>
    <g filter="url(#dropBig)">
      <circle cx="0" cy="0" r="200" fill="url(#body)"/>
      <circle cx="0" cy="0" r="200" fill="url(#rim)"/>
    </g>
    <ellipse cx="-58" cy="-64" rx="62" ry="42" fill="url(#shine)"/>
    <path fill="#ffffff" fill-rule="evenodd" transform="scale(4.5) translate(-64 -64)" d="
      M 42 34
      H 68
      C 80 34 88 41 88 50
      C 88 58 83 62 78 63
      C 84 64 90 69 90 78
      C 90 87 82 94 68 94
      H 42
      Z
      M 54 46
      V 58
      H 66
      C 70 58 74 56 74 52
      C 74 48 70 46 66 46
      Z
      M 54 68
      V 82
      H 66
      C 71 82 76 80 76 75
      C 76 70 71 68 66 68
      Z
    "/>
  </g>

  <g font-family="Anton, Impact, Arial Black, sans-serif">
    <text x="560" y="270"
          font-size="220"
          fill="#ffffff"
          letter-spacing="6">BALLS</text>

    <rect x="562" y="290" width="120" height="8" fill="#ffcf3a" rx="2"/>

    <text x="562" y="345"
          font-family="Inter, Helvetica Neue, Arial, sans-serif"
          font-weight="600"
          font-size="32"
          fill="#e2e8f0"
          letter-spacing="2">ON-CHAIN LOTTERY | ROBINHOOD CHAIN</text>

    <text x="562" y="395"
          font-family="Inter, Helvetica Neue, Arial, sans-serif"
          font-weight="500"
          font-size="24"
          fill="#94a3b8"
          letter-spacing="1">3% JACKPOT / EVERY 70 SECONDS / AUTO PAYOUTS</text>

    <text x="1470" y="480"
          font-family="JetBrains Mono, Menlo, monospace"
          text-anchor="end"
          font-size="18"
          fill="#64748b"
          letter-spacing="1">ballsonrobinhood.com</text>
  </g>
</svg>
