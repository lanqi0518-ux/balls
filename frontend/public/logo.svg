<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Balls">
  <defs>
    <!-- 3D red-ball body: matches .ball-winning in index.css -->
    <radialGradient id="body" cx="0.35" cy="0.28" r="0.78">
      <stop offset="0%"   stop-color="#ff9098"/>
      <stop offset="40%"  stop-color="#ef3247"/>
      <stop offset="80%"  stop-color="#b8102a"/>
      <stop offset="100%" stop-color="#7c0a1c"/>
    </radialGradient>

    <!-- Glossy top-left highlight -->
    <radialGradient id="shine" cx="0.35" cy="0.30" r="0.22">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft outer red halo so the ball reads on dark backgrounds -->
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="72%"  stop-color="#e31937" stop-opacity="0"/>
      <stop offset="100%" stop-color="#e31937" stop-opacity="0.45"/>
    </radialGradient>

    <!-- Inner rim shading for extra depth -->
    <radialGradient id="rim" cx="0.5" cy="0.55" r="0.5">
      <stop offset="80%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>

    <!-- Drop shadow the ball is standing on -->
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient glow around the ball -->
  <circle cx="64" cy="64" r="62" fill="url(#halo)"/>

  <!-- Ball body + shading, wrapped so the drop shadow applies to the whole ball -->
  <g filter="url(#drop)">
    <circle cx="64" cy="64" r="54" fill="url(#body)"/>
    <circle cx="64" cy="64" r="54" fill="url(#rim)"/>
  </g>

  <!-- Specular highlight sits on top of the ball but behind the letter -->
  <ellipse cx="47" cy="42" rx="17" ry="11" fill="url(#shine)"/>

  <!--
    Bold "B" as an SVG path so the mark renders identically everywhere
    (favicon tabs, iOS home-screen icons, Linux browsers without
    Microsoft fonts, etc.), independent of installed system fonts.
    Even-odd fill rule punches the two loops so the ball shows through.
  -->
  <path fill="#ffffff" fill-rule="evenodd" d="
    M 42 34
    H 68
    C 80 34 88 41 88 50
    C 88 58 83 62 78 63
    C 84 64 90 69 90 78
    C 90 87 82 94 68 94
    H 42
    Z
    M 54 46
    V 58
    H 66
    C 70 58 74 56 74 52
    C 74 48 70 46 66 46
    Z
    M 54 68
    V 82
    H 66
    C 71 82 76 80 76 75
    C 76 70 71 68 66 68
    Z
  "/>
</svg>
